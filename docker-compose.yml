services:
  verdaccio:
    image: verdaccio/verdaccio:6
    container_name: fhir-registry
    restart: unless-stopped

    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /verdaccio/storage/htpasswd ]; then
          touch /verdaccio/storage/htpasswd
        fi
        exec /usr/local/bin/verdaccio --config /verdaccio/conf/config.yaml

    volumes:
      - ./conf:/verdaccio/conf
      - verdaccio-storage:/verdaccio/storage

  nginx:
    image: nginx:alpine
    container_name: fhir-registry-proxy
    restart: unless-stopped

    ports:
      - "4873:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - verdaccio

volumes:
  verdaccio-storage: